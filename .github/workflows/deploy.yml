name: Deploy Backend to Render

on:
  push:
    branches:
      - main              # change to your main branch (e.g. ft/createEntities if needed)
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build (Maven) & Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17 (matches pom.xml)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Make mvnw executable
      - name: Make mvnw executable
        run: chmod +x ./mvnw

      # 4. Build the Spring Boot JAR (skip tests for speed)
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      # 5. Trigger Render deploy hook (Render pulls from GitHub automatically)
      #    This step calls the Render deploy hook URL to trigger an instant redeploy.
      #    Only runs when pushing to main (not on PRs).
      - name: Trigger Render Deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy triggered successfully!"
